[package]
name = "hangline"
version = "1.3.0"
license = "MIT"
description = "Hangline (晾图绳) - Windows screenshot clothesline"
authors = ["Hangline"]
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "hangline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
anyhow = "1.0.104"
thiserror = "2.0.21"
image = "0.25.10"
notify = "8.2.1"
blake3 = "1.8.7"
base64 = "0.23.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_UI_HiDpi", "Foundation", "Storage", "Storage_Search", "Storage_Streams", "Graphics_Imaging", "Globalization", "Media_Ocr", "Media_Editing", "Media_MediaProperties", "Media_Transcoding"] }
