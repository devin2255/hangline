name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "tag v$tag does not match package.json version $version" }
          Write-Host "releasing v$version"

      - run: pnpm check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Signed release: the updater private key/password come from repository secrets. The
      # script refuses to sign without them and never prints the key.
      - name: Build signed installer, portable and latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release/build-release.mjs --ci --sign

      - name: Verify signed manifest and budget
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/Hangline_*_x64-setup.exe | Select-Object -First 1
          # Must match SETUP_LIMIT_BYTES in scripts/release/build-release.mjs (W0.6: 8.5 MB).
          if (-not $setup -or $setup.Length -gt 8500000) { throw "installer missing or over 8.5 MB" }
          $manifest = Get-Content release/latest.json -Raw | ConvertFrom-Json
          $entry = $manifest.platforms."windows-x86_64-nsis"
          if (-not $entry) { $entry = $manifest.platforms."windows-x86_64" }
          if (-not $entry -or $entry.signature -eq "UNSIGNED-PLACEHOLDER" -or $entry.signature.Length -lt 100) {
            throw "latest.json is not signed with a real updater signature"
          }
          if ($entry.url -notmatch "Hangline_$($manifest.version)_x64-setup\.exe$") { throw "manifest URL does not point at the setup" }
          Write-Host "signed manifest: version=$($manifest.version) url=$($entry.url)"
          # Mainland mirror manifests: one per configured proxy, same signature, rewritten URLs,
          # and a signature trusted comment bound to the announced version (requireSignedVersion).
          node scripts/release/verify-cn-manifests.mjs

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Release body: use the reviewed per-release notes file when present, otherwise the
          # generic footer-only note. The footer must never claim Authenticode signing: SignPath
          # Foundation code signing is not enabled yet.
          $footer = "`n`n---`n`n**Authenticode status:** this build is **unsigned**. Hangline is applying for free code " +
            "signing from SignPath Foundation; until the signing policy is enabled, Windows SmartScreen " +
            "may show an unknown publisher - verify SHA256SUMS.txt.`n`n" +
            "Code signing policy: https://github.com/devin2255/hangline/blob/main/CODE_SIGNING_POLICY.md"
          $notesFile = "docs/release/notes-v$version.md"
          $title = "Hangline $version"
          if (Test-Path $notesFile) {
            $body = Get-Content $notesFile -Raw
            # Pull the subtitle from the notes heading: "# Hangline 1.3.0 — subtitle".
            if ($body -match '(?m)^# Hangline [^\r\n]*?—\s*(.+)$') { $title = "Hangline $version — $($Matches[1].Trim())" }
            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
            Set-Content -Path $notesPath -Value ($body + $footer) -Encoding utf8
            Write-Host "release notes: $notesFile -> $title"
          } else {
            Write-Host "notes file not found ($notesFile); using the generic note"
            $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
            Set-Content -Path $notesPath -Value ("Hangline $version. See CHANGELOG.md for details." + $footer) -Encoding utf8
          }
          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem release/Hangline_*_x64-setup.exe).FullName `
            (Get-ChildItem release/Hangline_*_x64-portable.zip).FullName `
            release/latest.json `
            (Get-ChildItem release/latest-cn-*.json).FullName `
            release/SHA256SUMS.txt `
            --title $title `
            --notes-file $notesPath `
            --verify-tag
